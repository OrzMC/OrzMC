name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLI 用例对齐需要 python / OrzMCKit；平台声明审计还会读取 app 与 Swift 库。
      # 只浅检出这 9 个校验输入，不安装依赖，也不检出其余插件/部署仓库。
      - name: Checkout verification sources
        run: |
          git submodule update --init --depth 1 -- \
            python swift/app swift/lib/OrzMCKit \
            swift/lib/MojangAPI swift/lib/PaperMC swift/lib/MCSManagerAPI \
            swift/lib/ExarotonAPI swift/lib/OrzSwiftKit swift/lib/OrzAppUpdater

      - name: Verify composition + conformance reference
        run: python3 scripts/verify/check.py
